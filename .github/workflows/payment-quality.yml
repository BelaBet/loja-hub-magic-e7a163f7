name: Payment Quality

on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/payment-quality.yml'
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: write

jobs:
  quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Auto-fix ESLint issues
        run: npx eslint . --fix

      - name: Commit lint fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: apply eslint fixes"
            git push
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
