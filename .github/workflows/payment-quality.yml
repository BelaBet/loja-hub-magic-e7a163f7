name: Payment Quality

on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/payment-quality.yml'
  push:
    branches:
      - main
      - 'fix/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
